services:
  ci-demo:
    image: kiwi-jenkins:local
    container_name: kiwi_dev_ci_demo
    entrypoint: ["python3", "/opt/kiwi/demo.py"]
    volumes:
      - ./deployment/jenkins/demo.py:/opt/kiwi/demo.py:ro
    networks:
      kiwi:
        aliases: [kiwi-ci-demo]
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
  jenkins:
    build:
      context: .
      dockerfile: deployment/jenkins/Dockerfile
    image: kiwi-jenkins:local
    container_name: kiwi_dev_jenkins
    ports:
      - "127.0.0.1:9081:8080"
    volumes:
      - kiwi_jenkins_home:/var/jenkins_home
      - ./deployment/jenkins/init.groovy:/usr/share/jenkins/ref/init.groovy.d/kiwi.groovy:ro
      - ${KIWI_JENKINS_SECRET_DIR:?Provide a private secrets directory}:/run/kiwi-secrets:ro
      - ./Jenkinsfile:/opt/kiwi/Jenkinsfile:ro
    networks:
      - kiwi
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
volumes:
  kiwi_jenkins_home:
networks:
  kiwi:
    external: true
    name: ${KIWI_DOCKER_NETWORK:-kiwi-dev-platform_platform-net}
