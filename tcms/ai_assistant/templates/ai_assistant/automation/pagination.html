{% if page.paginator %}<nav class="automation-pagination" aria-label="列表分页"><span>共 {{ page.paginator.count }} 条</span><div>{% if page.has_previous %}<a href="?{{ query }}&amp;{{ page_param|default:'page' }}={{ page.previous_page_number }}">上一页</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{{ query }}&amp;{{ page_param|default:'page' }}={{ page.next_page_number }}">下一页</a>{% endif %}</div></nav>{% endif %}
