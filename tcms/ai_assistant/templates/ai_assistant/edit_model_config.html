{% extends "ai_assistant/base_ai.html" %}

{% block ai_contents %}
<div class="container">
    <h1>编辑 AI 模型</h1>
    <p class="text-muted">
        正在编辑：{{ config.name }}。API 密钥留空会保留现有密钥。
    </p>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <p class="help-block">{{ field.help_text }}</p>
                {% endif %}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">保存修改</button>
        <a href="{% url 'ai_assistant:model_settings' %}"
           class="btn btn-default">
            取消
        </a>
    </form>
</div>
{% endblock %}
