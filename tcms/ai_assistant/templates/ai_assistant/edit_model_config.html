{% extends "ai_assistant/base_ai.html" %}

{% block ai_contents %}
<div class="container">
    <h1>编辑模型配置</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="form-group{% if field.errors %} has-error{% endif %}">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <p class="help-block">{{ field.help_text }}</p>
                {% endif %}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">保存修改</button>
        <a href="{% url 'ai_assistant:model_settings' %}"
           class="btn btn-default">
            取消
        </a>
    </form>
</div>
{% endblock %}
