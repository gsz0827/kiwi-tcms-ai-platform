{% load ui_labels %}<div class="table-responsive" data-linked-dev-tasks>
    <table class="table table-striped">
        <thead><tr><th scope="col">编号</th><th scope="col">开发任务</th><th scope="col">状态</th></tr></thead>
        <tbody>
        {% for linked_task in linked_tasks %}
            <tr>
                <td>{{ linked_task.task_number|default:linked_task.pk }}</td>
                <td><a href="{% url 'ai_assistant:dev_task_detail' linked_task.pk %}" target="_blank" rel="noopener noreferrer">{{ linked_task.title }}</a></td>
                <td>{{ linked_task.get_status_display|ui_term }}{% if linked_task.needs_update %} <span class="label label-warning">待更新</span>{% endif %}</td>
            </tr>
        {% empty %}
            <tr><td colspan="3" class="text-muted">暂无关联开发任务</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
